name: Reusable Python Data Pipeline

on:
  workflow_call:
    inputs:
      project_name:
        description: 'Name of the project directory (e.g., pharmaceutical-innovation-clusters)'
        required: true
        type: string
      analysis_script:
        description: 'Main analysis script to run (e.g., run_complete_analysis.py)'
        required: true
        type: string
      post_processing_scripts:
        description: 'Additional scripts to run after analysis (comma-separated, e.g., optimize_timeline_data.py,export_data.py)'
        required: false
        type: string
        default: ''
      required_data_files:
        description: 'Comma-separated list of required data files to validate (relative to project directory)'
        required: false
        type: string
        default: ''
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      upload_artifact_path:
        description: 'Path to upload as artifact (relative to project directory, e.g., frontend)'
        required: false
        type: string
        default: 'frontend'

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python ${{ inputs.python_version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(format('{0}/requirements.txt', inputs.project_name)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./${{ inputs.project_name }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis pipeline
        working-directory: ./${{ inputs.project_name }}
        run: |
          echo "Running main analysis script: ${{ inputs.analysis_script }}"
          python ${{ inputs.analysis_script }}

      - name: Run post-processing scripts
        if: inputs.post_processing_scripts != ''
        working-directory: ./${{ inputs.project_name }}
        run: |
          IFS=',' read -ra SCRIPTS <<< "${{ inputs.post_processing_scripts }}"
          for script in "${SCRIPTS[@]}"; do
            script=$(echo "$script" | xargs)  # Trim whitespace
            echo "Running post-processing script: $script"
            python "$script"
          done

      - name: Validate required data files
        if: inputs.required_data_files != ''
        working-directory: ./${{ inputs.project_name }}
        run: |
          echo "Validating required data files..."

          IFS=',' read -ra FILES <<< "${{ inputs.required_data_files }}"
          missing_files=()

          for file in "${FILES[@]}"; do
            file=$(echo "$file" | xargs)  # Trim whitespace
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done

          if [ ${#missing_files[@]} -ne 0 ]; then
            echo "ERROR: The following required files are missing:"
            printf '%s\n' "${missing_files[@]}"
            exit 1
          fi

          echo "✓ All required data files present!"

      - name: Show generated files summary
        working-directory: ./${{ inputs.project_name }}
        run: |
          echo "Generated data files:"
          find ${{ inputs.upload_artifact_path }}/data -type f -name "*.json" 2>/dev/null | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "  $size  $file"
          done || echo "No data files found"

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: './${{ inputs.project_name }}/${{ inputs.upload_artifact_path }}'

    outputs:
      artifact-uploaded: ${{ steps.upload-artifact.outcome == 'success' }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-data
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
