name: Deploy EDS Symptom Discovery

on:
  push:
    branches: [main]
    paths:
      - 'eds-symptom-discovery/**'
      - '.github/workflows/deploy-eds.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-eds"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('eds-symptom-discovery/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./eds-symptom-discovery
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis pipeline
        working-directory: ./eds-symptom-discovery
        continue-on-error: true
        run: |
          # Check for analysis scripts in src directory
          echo "Looking for analysis scripts..."
          find src -name "*.py" -type f | head -10

          # Run any available analysis scripts
          # Note: This project may not have a complete pipeline yet
          echo "Analysis pipeline would run here"

      - name: Ensure frontend data exists
        working-directory: ./eds-symptom-discovery
        run: |
          # Frontend data should already exist from previous runs
          echo "Frontend data files:"
          ls -lh frontend/data/*.json 2>/dev/null || echo "No data files found - using existing committed data"
          ls -lh frontend/data/*.png 2>/dev/null || echo "No image files found"

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: './eds-symptom-discovery/frontend'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
